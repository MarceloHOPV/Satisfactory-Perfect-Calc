server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS so resolution happens per-request, not at startup.
    # Without this, nginx fails with "host not found in upstream" if the backend
    # container isn't registered in Docker DNS yet when nginx first starts.
    resolver 127.0.0.11 valid=30s;

    location /api/ {
        set $upstream http://backend:8000;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # SPA fallback — all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
